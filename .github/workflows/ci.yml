name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Full verification (XCTest, Swift, Node, Python)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public file scope
        run: python3 scripts/prepare-source.py --check-index
      - name: Enable animations on the disposable runner
        run: |
          # runner-images disables these effects; the native tests exercise them.
          defaults read com.apple.universalaccess reduceMotion || true
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
          swift -e '
            import AppKit
            let reduced = NSWorkspace.shared.accessibilityDisplayShouldReduceMotion
            print("Animation prerequisites: reduceMotion=\(reduced), doubleClickInterval=\(NSEvent.doubleClickInterval)")
            precondition(!reduced, "Animation tests require Reduce Motion to be disabled")
          '
      - name: Full verification
        run: bash scripts/verify-local.sh full --log-dir .build/ci-verification
      - name: Build and verify local app bundle
        run: AGENTPET_APP_NAME="AgentPet Lite" bash scripts/build-local.sh
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: .build/ci-verification
          if-no-files-found: ignore
